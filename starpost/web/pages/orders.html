<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Заказы | Starpost</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/review.css">
</head>
<body>
  <header><a class="brand" href="/">STARPOST</a><nav></nav></header>
  <main><p class="eyebrow">ТРЕКИНГ ОРБИТАЛЬНЫХ ГРУЗОВ</p><h1>Мои заказы</h1><div id="orders"></div></main>

  <div id="review-modal" class="modal-backdrop" hidden>
    <section class="review-modal" role="dialog" aria-modal="true" aria-labelledby="review-title">
      <button class="modal-close" id="close-review" aria-label="Закрыть">×</button>
      <p class="eyebrow">ОБРАТНАЯ СВЯЗЬ</p>
      <h2 id="review-title">Оцените получение</h2>
      <p id="review-product" class="muted"></p>
      <div class="rating-picker" aria-label="Оценка от 1 до 5">
        <button type="button" data-rating="1">★</button><button type="button" data-rating="2">★</button><button type="button" data-rating="3">★</button><button type="button" data-rating="4">★</button><button type="button" data-rating="5">★</button>
      </div>
      <p id="rating-label" class="rating-label">Выберите оценку</p>
      <textarea id="review-body" maxlength="1000" placeholder="Расскажите о товаре и доставке"></textarea>
      <label class="private-toggle"><input id="review-private" type="checkbox"><span>Закрытый отзыв</span><small>Видно только продавцу</small></label>
      <div class="modal-actions"><button class="secondary-button" id="cancel-review">Отмена</button><button id="send-review">Опубликовать отзыв</button></div>
    </section>
  </div>

  <script src="/common.js"></script>
  <script>
    let activeOrder = null;
    let selectedRating = 0;
    const orderStore = new Map();
    const ratingLabels = ["", "Очень плохо", "Плохо", "Нормально", "Хорошо", "Отлично"];

    function openReview(order) {
      activeOrder = order;
      selectedRating = 0;
      $("#review-product").textContent = order.name;
      $("#review-body").value = "";
      $("#review-private").checked = false;
      $("#rating-label").textContent = "Выберите оценку";
      document.querySelectorAll(".rating-picker button").forEach(button => button.classList.remove("selected"));
      $("#review-modal").hidden = false;
    }

    function closeReview() { $("#review-modal").hidden = true; activeOrder = null; }

    document.querySelectorAll(".rating-picker button").forEach(button => button.onclick = () => {
      selectedRating = Number(button.dataset.rating);
      document.querySelectorAll(".rating-picker button").forEach(item => item.classList.toggle("selected", Number(item.dataset.rating) <= selectedRating));
      $("#rating-label").textContent = ratingLabels[selectedRating];
    });
    $("#close-review").onclick = closeReview;
    $("#cancel-review").onclick = closeReview;
    $("#review-modal").onclick = event => { if (event.target.id === "review-modal") closeReview(); };
    $("#send-review").onclick = async () => {
      const body = $("#review-body").value.trim();
      if (!selectedRating) return notify("Выберите оценку от 1 до 5", "error");
      if (!body) return notify("Напишите отзыв", "error");
      try {
        await api(`/api/orders/${activeOrder.id}/review`, {method: "POST", body: JSON.stringify({body, rating: selectedRating, private: $("#review-private").checked})});
        closeReview();
        load();
      } catch (error) { notify(error.message, "error"); }
    };

    async function load() {
      if (!await guard("buyer")) return;
      const rows = await api("/api/orders");
      orderStore.clear();
      rows.forEach(order => orderStore.set(order.id, order));
      $("#orders").innerHTML = rows.map(order => `<div class="row"><div><b>${esc(order.name)}</b><p class="status">${esc(order.tracking_code)} · ${esc(order.warehouse_status)} · ${esc(order.status)}</p>${order.cargo ? `<code>${esc(order.cargo)}</code>` : `<p class=muted>ATLAS-7: ${esc(order.warehouse_status)}</p>`}</div>${order.status === "delivered" ? `<button data-review-order="${order.id}">Оставить отзыв</button>` : ""}</div>`).join("") || "<p class=muted>Заказов нет.</p>";
    }
    $("#orders").onclick = event => {
      const button = event.target.closest("[data-review-order]");
      if (button) openReview(orderStore.get(Number(button.dataset.reviewOrder)));
    };
    load();
    setInterval(load, 1500);
  </script>
</body>
</html>
