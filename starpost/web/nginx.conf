server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Cache-Control "no-store" always;

  location = / { try_files /index.html =404; }
  location = /login/ { try_files /login.html =404; }
  location = /registr/ { try_files /registr.html =404; }
  location = /marketplace/ { try_files /marketplace.html =404; }
  location = /product/ { try_files /product.html =404; }
  location = /cart/ { try_files /cart.html =404; }
  location = /account/ { try_files /account.html =404; }
  location = /orders/ { try_files /orders.html =404; }
  location = /seller/ { try_files /seller.html =404; }
  location = /contract/ { try_files /contract.html =404; }
  location /api/ { proxy_pass http://api:5000; proxy_set_header Host $host; }
  location = /health { proxy_pass http://api:5000; }
}
